# tmux is here for the watchdog, not for you: `capture-pane` is how it reads
# the console and `send-keys` is how it types `continue` back in.
#
# Claude Code is a full-screen TUI that redraws in place. That constrains
# what this config may do -- see the alternate screen note below.

# Alternate screen ON (tmux's default; do NOT disable it).
#
# An earlier version of this file set `terminal-overrides ',*:smcup@:rmcup@'`
# to disable it, so the terminal's own scrollback would capture the session.
# That is fine for a shell printing lines, and wrong for a redrawing TUI:
# without the alternate screen Claude's repaints land in the scrollback
# buffer and the display smears and duplicates. Native scrollback is not
# worth a broken console -- use tmux copy-mode (Ctrl-b [) instead.

# Truecolor. `screen-256color` caps at 256 and makes Claude's palette look
# flat and wrong; tmux-256color plus RGB gives it the full range. The
# terminfo entry comes from ncurses-term, installed in the Dockerfile.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-features ",*:usstyle"

# Mouse off: your terminal keeps its own click-drag selection and copy rather
# than tmux capturing the mouse. This part was worth keeping.
set -g mouse off

# Resize to the client actually looking at the pane, not to the smallest
# client that ever attached -- otherwise the console stays boxed into a
# stale size after you detach from a small window.
set -g aggressive-resize on

set -g history-limit 50000

# bash, not sh: new windows/panes opened in the console get a real bash.
set -g default-shell /bin/bash

# Don't swallow the Escape key: Claude uses it, and the default 500ms wait
# makes it feel broken.
set -sg escape-time 10

set -g status off

# Let escape sequences tmux doesn't handle itself reach the terminal, so
# Claude's OSC-based features (hyperlinks, clipboard writes) still work.
set -g allow-passthrough on
