# tmux is here for the watchdog, not for you: `capture-pane` is how it reads
# the console and `send-keys` is how it types `continue` back in. This config
# keeps that working while making an attached session behave as close to a
# plain terminal as possible.

# Mouse off: your terminal keeps its own click-drag selection and copy, rather
# than tmux capturing the mouse and forcing copy-mode.
set -g mouse off

# Don't switch to the alternate screen. Output stays in your terminal's normal
# buffer, so its native scrollback and scroll wheel work as usual instead of
# needing tmux copy-mode.
set -ga terminal-overrides ',*:smcup@:rmcup@'

# Still keep a deep tmux history for capture-pane and for copy-mode if wanted.
set -g history-limit 50000

set -g default-terminal "screen-256color"

# bash, not sh: new windows/panes opened in the console get a real bash.
set -g default-shell /bin/bash
set -sg escape-time 10
set -g status off

# Let escape sequences tmux doesn't handle itself reach the terminal, so
# Claude's OSC-based features (hyperlinks, clipboard writes) still work.
set -g allow-passthrough on
