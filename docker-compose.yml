services:
  claude:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        # Tool versions are build-time, so they belong here rather than in
        # `environment:` -- change one and rebuild.
        GH_VERSION: ${GH_VERSION:-2.63.2}
        GLAB_VERSION: ${GLAB_VERSION:-1.52.0}
    image: claude-console:latest
    container_name: ${CONTAINER_NAME:-claude-console}
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      # Host timezone matters: the reset times Claude prints are local, and
      # the watchdog compares them against the container clock.
      TZ: ${TZ:-UTC}
      WORKSPACE: /workspace

      # --- runtime user ---
      # Claude runs unprivileged as these ids, so files it writes into the
      # mounted workspace are owned by you on the host rather than by root.
      # Match your own: `id -u` / `id -g`.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # auto  chown the workspace only when its owner doesn't match PUID
      # always force it on every start
      # never  skip it (read-only or NFS-backed mounts)
      CHOWN_WORKSPACE: ${CHOWN_WORKSPACE:-auto}

      # --- console ---
      # Extra flags for the console's claude process,
      # e.g. "--permission-mode acceptEdits"
      CLAUDE_ARGS: ${CLAUDE_ARGS:-}
      CLAUDE_TMUX_SESSION: ${CLAUDE_TMUX_SESSION:-claude}

      # --- status line / usage reporting ---
      # The status line renders the 5-hour and 7-day usage windows AND
      # publishes them to USAGE_STATE_FILE, which is the watchdog's primary
      # source. Disabling it falls the watchdog back to console scraping.
      STATUSLINE_ENABLED: ${STATUSLINE_ENABLED:-true}
      # Also re-run on a timer, since windows move while the session is idle.
      STATUSLINE_REFRESH_SECONDS: ${STATUSLINE_REFRESH_SECONDS:-60}
      USAGE_STATE_FILE: ${USAGE_STATE_FILE:-/var/lib/claude-watchdog/usage.json}
      # Older than this and the file is ignored as possibly out of date.
      USAGE_STATE_MAX_AGE: ${USAGE_STATE_MAX_AGE:-1800}

      # --- rate-limit watchdog ---
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_MIN: ${WATCHDOG_INTERVAL_MIN:-10}
      # What gets typed into the console once the limit window has reset.
      CONTINUE_TEXT: ${CONTINUE_TEXT:-continue}
      # Floor between two `/usage` probes, and between two nudges (seconds).
      USAGE_PROBE_MIN_INTERVAL: ${USAGE_PROBE_MIN_INTERVAL:-3600}
      NUDGE_MIN_INTERVAL: ${NUDGE_MIN_INTERVAL:-900}
      # Seconds to let `/usage` render before reading the pane back.
      USAGE_PROBE_WAIT: ${USAGE_PROBE_WAIT:-8}
      # Lines of scrollback the watchdog inspects.
      PANE_LINES: ${PANE_LINES:-300}
    healthcheck:
      # Healthy means the console is alive and the watchdog can still fire.
      # A session parked on a rate limit stays healthy on purpose -- that is
      # the state the watchdog exists to recover from, not a fault.
      test: ["CMD", "/usr/local/bin/claude-healthcheck"]
      interval: ${HEALTHCHECK_INTERVAL:-60s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      # The entrypoint restarts a dead console within ~30s, so allow a
      # window before the first probe counts and a few retries after.
      start_period: ${HEALTHCHECK_START_PERIOD:-60s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    volumes:
      # Point WORKSPACE_DIR at whatever project you want in the container.
      # Drop this line entirely and the image still runs, just with an empty
      # workspace -- nothing in the image depends on a mount.
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # The whole home directory, not just ~/.claude: Claude Code splits its
      # state across ~/.claude/ (credentials, plugins, transcripts) AND the
      # separate file ~/.claude.json (onboarding state, user id, per-project
      # settings, marketplace flags). Mounting only ~/.claude silently loses
      # the latter on every rebuild.
      - claude-home:/home/claude

volumes:
  # Home directory of the unprivileged `claude` user. Covers both ~/.claude
  # and the separate ~/.claude.json, which is why it's the whole home rather
  # than just the config directory. See README.
  claude-home:
